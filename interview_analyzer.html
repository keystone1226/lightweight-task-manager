<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>인터뷰 분석기 — Interview Insights</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --safe-b: env(safe-area-inset-bottom, 0px); }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f0f2f5;
      min-height: 100vh; min-height: 100dvh;
      display: flex; align-items: flex-start; justify-content: center;
      padding: 40px 24px;
      -webkit-text-size-adjust: 100%;
    }

    .card {
      background: #fff; border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.10);
      padding: 36px 40px; max-width: 640px; width: 100%;
    }

    .logo { display: flex; align-items: center; gap: 12px; margin-bottom: 6px; }
    .logo-icon {
      width: 40px; height: 40px; flex-shrink: 0;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      border-radius: 10px; display: flex; align-items: center;
      justify-content: center; color: #fff; font-size: 20px;
    }
    h1 { font-size: 22px; font-weight: 700; color: #1a1a2e; }
    .subtitle { color: #6b7280; font-size: 14px; margin-bottom: 24px; margin-top: 4px; }

    /* Steps */
    .steps {
      display: flex; margin-bottom: 24px;
      border-radius: 8px; overflow: hidden; border: 1px solid #e5e7eb;
    }
    .step {
      flex: 1; padding: 10px 4px; text-align: center;
      font-size: 12px; font-weight: 600; color: #9ca3af;
      background: #f9fafb; border-right: 1px solid #e5e7eb; white-space: nowrap;
    }
    .step:last-child { border-right: none; }
    .step.active { background: #eef2ff; color: #4f46e5; }
    .step.done   { background: #f0fdf4; color: #15803d; }

    .env-badge {
      display: flex; align-items: center; gap: 8px;
      background: #f0fdf4; border: 1px solid #86efac;
      border-radius: 8px; padding: 10px 14px;
      font-size: 13px; color: #15803d; font-weight: 600;
      margin-bottom: 18px;
    }

    /* Fields */
    label { display: block; font-size: 13px; font-weight: 600; color: #374151; margin-bottom: 6px; }
    label span { font-weight: 400; color: #9ca3af; font-size: 12px; margin-left: 4px; }
    .field { margin-bottom: 18px; }

    /* 16px prevents iOS auto-zoom */
    input[type="password"], input[type="text"], textarea {
      width: 100%; padding: 12px 14px;
      border: 1px solid #d1d5db; border-radius: 8px;
      font-size: 16px; color: #111827; font-family: inherit;
      -webkit-appearance: none;
      transition: border-color .2s, box-shadow .2s;
    }
    input:focus, textarea:focus {
      outline: none; border-color: #6366f1;
      box-shadow: 0 0 0 3px rgba(99,102,241,.12);
    }

    .save-key {
      display: flex; align-items: center; gap: 6px;
      font-size: 12px; color: #9ca3af; margin-top: 6px;
      cursor: pointer; -webkit-tap-highlight-color: transparent;
    }
    .save-key input[type="checkbox"] { width: 16px; height: 16px; }

    .tip {
      background: #fefce8; border: 1px solid #fde68a;
      border-radius: 8px; padding: 10px 14px;
      font-size: 12px; color: #92400e; margin-bottom: 18px; line-height: 1.6;
    }

    /* Input mode tabs */
    .input-tabs {
      display: flex; border: 1px solid #e5e7eb;
      border-radius: 10px; overflow: hidden; margin-bottom: 14px;
    }
    .tab-btn {
      flex: 1; padding: 12px 6px; border: none; background: #f9fafb;
      font-size: 13px; font-weight: 600; color: #9ca3af;
      cursor: pointer; text-align: center;
      border-right: 1px solid #e5e7eb;
      -webkit-tap-highlight-color: transparent;
      transition: background .2s, color .2s;
    }
    .tab-btn:last-child { border-right: none; }
    .tab-btn.active { background: #eef2ff; color: #4f46e5; }
    .tab-btn:active  { background: #e0e7ff; }

    .tab-panel { display: none; }
    .tab-panel.active { display: block; }

    /* Drop zone */
    .dropzone {
      border: 2px dashed #c7d2fe; border-radius: 12px;
      padding: 32px 16px; text-align: center; cursor: pointer;
      background: #fafafa; transition: border-color .2s, background .2s;
      position: relative;
      min-height: 110px; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
    }
    .dropzone.hover  { border-color: #6366f1; background: #eef2ff; }
    .dropzone.loaded { border-color: #10b981; background: #f0fdf4; }
    .dropzone input[type="file"] {
      position: absolute; inset: 0; opacity: 0; cursor: pointer;
      width: 100%; height: 100%;
    }
    .drop-icon  { font-size: 28px; margin-bottom: 8px; }
    .drop-title { font-size: 14px; font-weight: 600; color: #374151; }
    .drop-hint  { font-size: 12px; color: #9ca3af; margin-top: 4px; }

    .file-badge {
      display: none; align-items: center; gap: 10px; margin-top: 12px;
      padding: 12px 14px; background: #f3f4f6; border-radius: 8px;
    }
    .file-badge.visible { display: flex; }
    .file-badge-name {
      font-size: 13px; font-weight: 600; flex: 1;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .file-badge-meta { font-size: 11px; color: #6b7280; flex-shrink: 0; }
    .remove-btn {
      background: none; border: none; cursor: pointer; color: #9ca3af;
      font-size: 18px; border-radius: 6px;
      min-width: 44px; min-height: 44px;
      display: flex; align-items: center; justify-content: center;
    }
    .remove-btn:hover, .remove-btn:active { color: #ef4444; background: #fee2e2; }

    /* Paste area */
    .paste-area {
      width: 100%; min-height: 180px; resize: vertical;
      font-size: 15px; line-height: 1.7;
    }
    .char-count { text-align: right; font-size: 11px; color: #9ca3af; margin-top: 4px; }

    /* Buttons */
    .analyse-btn {
      width: 100%; margin-top: 20px; padding: 16px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      color: #fff; border: none; border-radius: 12px;
      font-size: 16px; font-weight: 600; cursor: pointer;
      min-height: 52px; transition: opacity .2s, transform .1s;
    }
    .analyse-btn:disabled { opacity: 0.38; cursor: not-allowed; }
    .analyse-btn:not(:disabled):hover { opacity: 0.90; }
    .analyse-btn:not(:disabled):active { transform: scale(0.98); }

    .download-btn {
      width: 100%; padding: 15px;
      background: #10b981; color: #fff;
      border: none; border-radius: 10px;
      font-size: 15px; font-weight: 600; cursor: pointer;
      min-height: 52px; transition: opacity .2s;
    }
    .download-btn:hover, .download-btn:active { opacity: 0.88; }

    .reset-btn {
      width: 100%; margin-top: 10px; padding: 12px;
      background: none; border: 1px solid #d1d5db;
      border-radius: 8px; font-size: 14px; color: #6b7280;
      cursor: pointer; min-height: 48px;
    }
    .reset-btn:hover, .reset-btn:active { background: #f3f4f6; }

    /* Progress */
    .progress {
      display: none; margin-top: 18px;
      padding: 14px 16px; background: #eff6ff;
      border: 1px solid #bfdbfe; border-radius: 10px;
    }
    .progress.visible { display: block; }
    .progress-bar-wrap {
      height: 6px; background: #dbeafe; border-radius: 3px;
      margin-bottom: 10px; overflow: hidden;
    }
    .progress-bar {
      height: 100%; background: #6366f1; border-radius: 3px;
      width: 0%; transition: width .4s ease;
    }
    .progress-text { font-size: 13px; color: #1d4ed8; }

    /* Result */
    .result-section { display: none; margin-top: 18px; }
    .result-section.visible { display: block; }
    .result-preview {
      background: #f8fafc; border: 1px solid #e2e8f0;
      border-radius: 10px; padding: 14px 16px; margin-bottom: 14px;
    }
    .result-title { font-size: 15px; font-weight: 700; margin-bottom: 12px; }
    .result-badges { display: flex; gap: 8px; flex-wrap: wrap; }
    .rbadge { padding: 5px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; }
    .rbadge-q  { background: #fef9c3; color: #854d0e; }
    .rbadge-pp { background: #fee2e2; color: #991b1b; }
    .rbadge-fl { background: #ede9fe; color: #5b21b6; }

    /* Error */
    .error-box {
      display: none; margin-top: 14px; padding: 12px 16px;
      background: #fef2f2; border: 1px solid #fecaca;
      border-radius: 8px; color: #b91c1c; font-size: 13px;
    }
    .error-box.visible { display: block; }

    .footer {
      margin-top: 24px; padding-top: 18px;
      border-top: 1px solid #f3f4f6;
      font-size: 11px; color: #9ca3af; text-align: center; line-height: 1.6;
    }

    /* ═══ MOBILE ═══════════════════════════════════ */
    @media (max-width: 640px) {
      body { padding: 0; background: #fff; }
      .card {
        border-radius: 0; box-shadow: none;
        padding: 20px 16px;
        padding-bottom: calc(20px + var(--safe-b));
        max-width: 100%;
      }
      h1 { font-size: 20px; }
      .subtitle { font-size: 13px; margin-bottom: 16px; }
      .steps { margin-bottom: 16px; }
      .step { padding: 9px 2px; font-size: 11px; }
      .field { margin-bottom: 14px; }
      .tab-btn { padding: 14px 4px; font-size: 12px; }
      .dropzone { padding: 24px 12px; min-height: 96px; }
      .drop-icon { font-size: 24px; margin-bottom: 6px; }
      .drop-title { font-size: 13px; }
      .paste-area { min-height: 140px; }
      .tip { font-size: 11px; padding: 8px 12px; }
      .footer { font-size: 10px; }

      .analyse-btn {
        position: sticky; bottom: 0; z-index: 10;
        border-radius: 0;
        margin: 16px -16px 0; width: calc(100% + 32px);
        padding-bottom: calc(16px + var(--safe-b));
      }
    }
  </style>
</head>
<body>
<div class="card">
  <div class="logo">
    <div class="logo-icon">🎤</div>
    <h1>인터뷰 분석기</h1>
  </div>
  <p class="subtitle">녹취록을 입력하면 Claude AI가 질문·페인포인트·플로우를 JSON으로 정리합니다.</p>

  <div class="steps">
    <div class="step done"   id="step1">① API 키 ✓</div>
    <div class="step active" id="step2">② 녹취록</div>
    <div class="step"        id="step3">③ 완료</div>
  </div>

  <div class="env-badge">
    🔑 API 키가 서버 환경변수에서 자동으로 로드됩니다
  </div>

  <!-- Input mode tabs -->
  <div class="field">
    <label>녹취록 입력</label>
    <div class="input-tabs">
      <button class="tab-btn active" data-tab="file">📄 파일 업로드</button>
      <button class="tab-btn"        data-tab="paste">📝 직접 입력</button>
    </div>

    <!-- Tab: File -->
    <div class="tab-panel active" id="panel-file">
      <div class="dropzone" id="dropzone">
        <input type="file" id="fileInput" accept=".txt,text/plain" />
        <div class="drop-icon">📄</div>
        <div class="drop-title" id="dropTitle">탭해서 텍스트 파일 선택</div>
        <div class="drop-hint">.txt 파일 (UTF-8)</div>
      </div>
      <div class="file-badge" id="fileBadge">
        <span>📄</span>
        <span class="file-badge-name" id="fbName"></span>
        <span class="file-badge-meta" id="fbMeta"></span>
        <button class="remove-btn" id="removeBtn">✕</button>
      </div>
    </div>

    <!-- Tab: Paste -->
    <div class="tab-panel" id="panel-paste">
      <textarea class="paste-area" id="pasteArea"
        placeholder="녹취록을 여기에 붙여넣으세요.&#10;&#10;클로바노트, 다글로, 보이스메모 등에서 복사한 텍스트를 그대로 붙여넣기 하면 됩니다."></textarea>
      <div class="char-count" id="charCount">0자</div>
    </div>
  </div>

  <button class="analyse-btn" id="analyseBtn" disabled>분석 시작</button>

  <div class="progress" id="progress">
    <div class="progress-bar-wrap"><div class="progress-bar" id="progressBar"></div></div>
    <div class="progress-text" id="progressText">분석 준비 중…</div>
  </div>

  <div class="error-box" id="errorBox"></div>

  <div class="result-section" id="resultSection">
    <div class="result-preview">
      <div class="result-title" id="resultTitle"></div>
      <div class="result-badges">
        <span class="rbadge rbadge-q"  id="rQ"></span>
        <span class="rbadge rbadge-pp" id="rPP"></span>
        <span class="rbadge rbadge-fl" id="rFL"></span>
      </div>
    </div>
    <button class="download-btn" id="downloadBtn">⬇ JSON 다운로드</button>
    <button class="reset-btn"    id="resetBtn">다른 인터뷰 분석</button>
  </div>

  <div class="footer">
    로컬 서버 경유 · API 키는 환경변수에서 로드 · 외부에 노출되지 않습니다
  </div>
</div>

<script>
// ══════════════════════════════════════════════════════════════
// Prompt
// ══════════════════════════════════════════════════════════════
const SYSTEM_PROMPT = `You are a senior UX researcher. Extract structured information from interview transcripts.
Always respond with valid JSON ONLY — no markdown fences, no preamble, no explanation.
The JSON must strictly follow the schema provided by the user.`;

function buildPrompt(transcript) {
  return `아래 인터뷰 녹취록을 분석해서 다음 JSON 스키마에 맞춰 정리해줘.
JSON만 출력하고, 다른 텍스트(마크다운 포함)는 절대 출력하지 마.

=== JSON 스키마 ===
{
  "interview_title": "인터뷰의 핵심 주제를 담은 간결한 제목 (20자 이내)",
  "questions": [
    { "id": "q_1", "text": "인터뷰어의 주요 질문 내용 (중복 제외)", "category": "질문 카테고리 예: 배경/니즈/행동/만족도" }
  ],
  "pain_points": [
    {
      "id": "pp_1",
      "title": "페인포인트 제목 (15자 이내)",
      "description": "상세 설명 (2~3문장)",
      "severity": "high 또는 medium 또는 low",
      "quote": "녹취록에서 인터뷰이가 직접 언급한 문장 (있을 경우만)"
    }
  ],
  "flows": [
    {
      "id": "flow_1",
      "title": "이 플로우를 설명하는 한 줄 제목",
      "nodes": [
        { "id": "n1", "label": "단계 이름 (10자 이내)", "type": "Start 또는 Process 또는 Decision 또는 End", "description": "" }
      ],
      "edges": [
        { "id": "e1", "source": "n1", "target": "n2", "label": "조건 또는 레이블 (선택)" }
      ]
    }
  ]
}

=== 규칙 ===
- questions: 인터뷰어가 한 중요 질문만 포함 (중복 질문 제외, 최대 12개)
- pain_points: 인터뷰이가 언급한 불편함·문제점·니즈 (최대 12개)
  severity 기준: high=업무/서비스에 심각한 영향, medium=불편하지만 우회 가능, low=사소한 불편
- flows: 인터뷰이가 설명한 업무 프로세스·사용자 여정·의사결정 흐름이 있을 경우만 포함 (없으면 [])
  - 하나의 인터뷰에서 여러 플로우가 나올 수 있음 (각각 별도 객체)
  - 노드 id는 flow 안에서 unique해야 함
  - edge의 source/target은 반드시 존재하는 노드 id여야 함
  - Start 타입 노드 1개, End 타입 노드 1개 이상 포함

=== 인터뷰 녹취록 ===
---
${transcript}
---`;
}

// ══════════════════════════════════════════════════════════════
// State & DOM
// ══════════════════════════════════════════════════════════════
let transcriptText = "";
let transcriptName = "";
let resultJSON     = null;

const $ = id => document.getElementById(id);

const analyseBtn  = $("analyseBtn");
const progress    = $("progress");
const progressBar = $("progressBar");
const progressTxt = $("progressText");
const errorBox    = $("errorBox");
const resultSec   = $("resultSection");
const resultTitle = $("resultTitle");
const downloadBtn = $("downloadBtn");
const resetBtn    = $("resetBtn");
const s1 = $("step1"), s2 = $("step2"), s3 = $("step3");

const dropzone  = $("dropzone");
const fileInput = $("fileInput");
const fileBadge = $("fileBadge");
const fbName    = $("fbName");
const fbMeta    = $("fbMeta");
const removeBtn = $("removeBtn");
const pasteArea = $("pasteArea");
const charCount = $("charCount");

// ══════════════════════════════════════════════════════════════
// Tab switching
// ══════════════════════════════════════════════════════════════
document.querySelectorAll(".tab-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
    document.querySelectorAll(".tab-panel").forEach(p => p.classList.remove("active"));
    btn.classList.add("active");
    $("panel-" + btn.dataset.tab).classList.add("active");
  });
});

// ══════════════════════════════════════════════════════════════
// Detect touch → adjust drop-zone label
// ══════════════════════════════════════════════════════════════
if (!("ontouchstart" in window) && navigator.maxTouchPoints === 0) {
  $("dropTitle").textContent = "클릭하거나 드래그해서 파일 선택";
}

// ══════════════════════════════════════════════════════════════
// Tab: File upload
// ══════════════════════════════════════════════════════════════
dropzone.addEventListener("dragover",  e => { e.preventDefault(); dropzone.classList.add("hover"); });
dropzone.addEventListener("dragleave", () => dropzone.classList.remove("hover"));
dropzone.addEventListener("drop", e => {
  e.preventDefault(); dropzone.classList.remove("hover");
  loadFile(e.dataTransfer.files[0]);
});
fileInput.addEventListener("change", () => loadFile(fileInput.files[0]));

function loadFile(file) {
  if (!file) return;
  const ext = file.name.split(".").pop().toLowerCase();
  if (ext !== "txt") { showError("텍스트 파일(.txt)만 지원됩니다."); return; }

  const reader = new FileReader();
  reader.onload = e => {
    transcriptText = e.target.result;
    transcriptName = file.name;
    const words = transcriptText.split(/\s+/).filter(Boolean).length;
    fbName.textContent = file.name;
    fbMeta.textContent = `${(file.size / 1024).toFixed(1)} KB · ${words.toLocaleString()}단어`;
    fileBadge.classList.add("visible");
    dropzone.classList.add("loaded");
    updateBtn(); clearError(); markDone(s2);
  };
  reader.readAsText(file, "utf-8");
}

removeBtn.addEventListener("click", e => {
  e.stopPropagation();
  transcriptText = ""; transcriptName = "";
  fileBadge.classList.remove("visible");
  dropzone.classList.remove("loaded");
  fileInput.value = "";
  updateBtn(); s2.classList.remove("done");
});

// ══════════════════════════════════════════════════════════════
// Tab: Direct paste
// ══════════════════════════════════════════════════════════════
pasteArea.addEventListener("input", () => {
  const text = pasteArea.value.trim();
  charCount.textContent = `${text.length.toLocaleString()}자`;
  if (text.length > 0) {
    transcriptText = text;
    transcriptName = "직접입력.txt";
    markDone(s2);
  } else {
    transcriptText = ""; transcriptName = "";
    s2.classList.remove("done");
  }
  updateBtn();
});

// ══════════════════════════════════════════════════════════════
// Analyse
// ══════════════════════════════════════════════════════════════
function updateBtn() {
  analyseBtn.disabled = !transcriptText;
}

analyseBtn.addEventListener("click", async () => {
  if (!transcriptText) return;

  analyseBtn.disabled = true;
  clearError();
  resultSec.classList.remove("visible");
  showProgress(10, "Claude에게 녹취록 전송 중…");

  try {
    showProgress(30, "Claude가 분석 중… (10~30초 소요)");

    const resp = await fetch("/proxy", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({
        model:      "claude-sonnet-4-6",
        max_tokens: 4096,
        system:     SYSTEM_PROMPT,
        messages:   [{ role: "user", content: buildPrompt(transcriptText) }],
      }),
    });

    showProgress(75, "응답 수신 중…");

    if (!resp.ok) {
      const err = await resp.json().catch(() => ({}));
      throw new Error(err.error?.message || `HTTP ${resp.status}`);
    }

    const body    = await resp.json();
    const rawText = body.content?.[0]?.text || "";

    showProgress(90, "JSON 파싱 중…");

    const parsed = extractJSON(rawText);

    resultJSON = {
      schema_version:  "1.0",
      interview_title: parsed.interview_title || transcriptName.replace(/\.txt$/i, ""),
      analyzed_at:     new Date().toISOString().slice(0, 10),
      source_file:     transcriptName,
      questions:       parsed.questions    || [],
      pain_points:     parsed.pain_points  || [],
      flows:           parsed.flows        || [],
    };

    showProgress(100, "완료!");
    setTimeout(() => {
      progress.classList.remove("visible");
      showResult(resultJSON);
    }, 600);

  } catch (err) {
    hideProgress();
    analyseBtn.disabled = false;
    showError(`오류: ${err.message}`);
  }
});

// ══════════════════════════════════════════════════════════════
// Result & Download
// ══════════════════════════════════════════════════════════════
function showResult(data) {
  resultTitle.textContent = data.interview_title;
  $("rQ").textContent  = `💬 질문 ${data.questions.length}개`;
  $("rPP").textContent = `⚠️ 페인포인트 ${data.pain_points.length}개`;
  $("rFL").textContent = `🔀 플로우 ${data.flows.length}개`;
  resultSec.classList.add("visible");
  markDone(s3);
  resultSec.scrollIntoView({ behavior: "smooth", block: "start" });
}

downloadBtn.addEventListener("click", () => {
  if (!resultJSON) return;
  const blob = new Blob([JSON.stringify(resultJSON, null, 2)], { type: "application/json" });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement("a");
  a.href     = url;
  a.download = `${(resultJSON.interview_title || "interview").replace(/\s+/g, "_")}_analysis.json`;
  a.click();
  URL.revokeObjectURL(url);
});

resetBtn.addEventListener("click", () => {
  transcriptText = ""; transcriptName = ""; resultJSON = null;
  fileInput.value = ""; pasteArea.value = "";
  charCount.textContent = "0자";
  fileBadge.classList.remove("visible");
  dropzone.classList.remove("loaded");
  resultSec.classList.remove("visible");
  hideProgress(); clearError();
  analyseBtn.disabled = true;
  s2.classList.remove("done", "active");
  s3.classList.remove("done", "active");
});

// ══════════════════════════════════════════════════════════════
// Helpers
// ══════════════════════════════════════════════════════════════

// Claude 응답에서 JSON을 추출하는 강건한 파서
// 마크다운 펜스, 앞뒤 텍스트, unquoted key 등 대응
function extractJSON(text) {
  // 전략 1: 그대로 파싱 (이상적인 케이스)
  try { return JSON.parse(text.trim()); } catch {}

  // 전략 2: 마크다운 코드 블록 제거 후 파싱
  const stripped = text
    .replace(/^```(?:json)?\s*/i, "")
    .replace(/\s*```\s*$/i, "")
    .trim();
  try { return JSON.parse(stripped); } catch {}

  // 전략 3: 가장 바깥쪽 {...} 추출 후 파싱
  const match = text.match(/\{[\s\S]*\}/);
  if (match) {
    try { return JSON.parse(match[0]); } catch {}
  }

  // 전략 4: 따옴표 없는 키를 수정 후 재시도 (unquoted property name)
  if (match) {
    const fixed = match[0].replace(/([{,]\s*)([A-Za-z_][A-Za-z0-9_]*)(\s*:)/g, '$1"$2"$3');
    try { return JSON.parse(fixed); } catch {}
  }

  throw new SyntaxError("응답에서 유효한 JSON을 찾을 수 없습니다. 다시 시도해 주세요.");
}

function markDone(el) { el.classList.add("done"); el.classList.remove("active"); }
function showProgress(pct, msg) {
  progress.classList.add("visible");
  progressBar.style.width = pct + "%";
  progressTxt.textContent = msg;
}
function hideProgress() { progress.classList.remove("visible"); }
function showError(msg) { errorBox.className = "error-box visible"; errorBox.textContent = msg; }
function clearError()   { errorBox.className = "error-box"; errorBox.textContent = ""; }
</script>
