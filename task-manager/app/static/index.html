<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task Manager</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <!-- Header -->
  <header class="header">
    <h1>Task Manager</h1>
    <div class="header-actions">
      <button class="btn btn-secondary btn-sm" id="reportBtn">📋 주간보고</button>
      <button class="notification-bell" id="notifBell" title="Notifications">
        &#128276;
        <span class="notification-badge" id="notifBadge" style="display:none">0</span>
      </button>
      <div class="user-info" id="userInfo">
        <span id="currentUserName">-</span>
      </div>
    </div>
  </header>

  <!-- Board -->
  <div class="board" id="board"></div>

  <!-- Notification Panel -->
  <div class="notification-panel" id="notifPanel">
    <div class="notification-panel-header">
      <span>Notifications</span>
      <button class="btn btn-sm btn-secondary" id="markAllRead">Mark all read</button>
    </div>
    <div id="notifList"></div>
  </div>

  <!-- Task Modal -->
  <div class="modal-overlay" id="taskModal">
    <div class="modal">
      <h2 id="taskModalTitle">New Task</h2>
      <form id="taskForm">
        <input type="hidden" id="taskId">
        <input type="hidden" id="taskStatus">
        <div class="form-group">
          <label for="taskTitle">Title *</label>
          <input type="text" id="taskTitle" required placeholder="Enter task title">
        </div>
        <div class="form-group">
          <label for="taskDesc">Description</label>
          <textarea id="taskDesc" placeholder="Task description..."></textarea>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="taskPriority">Priority</label>
            <select id="taskPriority">
              <option value="LOW">Low</option>
              <option value="MEDIUM" selected>Medium</option>
              <option value="HIGH">High</option>
            </select>
          </div>
          <div class="form-group">
            <label for="taskAssignee">Assignee</label>
            <select id="taskAssignee">
              <option value="">Unassigned</option>
            </select>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="taskDueDate">Due Date</label>
            <input type="date" id="taskDueDate">
          </div>
          <div class="form-group">
            <label for="taskTags">Tags (comma separated)</label>
            <input type="text" id="taskTags" placeholder="UI, Icon, Research">
          </div>
        </div>
        <div class="form-group">
          <label for="taskLinkUrl">Link URL</label>
          <input type="url" id="taskLinkUrl" placeholder="https://...">
          <div class="og-preview" id="ogPreview" style="display:none">
            <img class="og-preview-image" id="ogPreviewImage" style="display:none">
            <div class="og-preview-text">
              <div class="og-preview-site" id="ogPreviewSite"></div>
              <div class="og-preview-title" id="ogPreviewTitle"></div>
              <div class="og-preview-desc" id="ogPreviewDesc"></div>
            </div>
          </div>
        </div>
        <div class="form-group">
          <label>Cover Image</label>
          <div class="image-upload-area" id="imageUploadArea">
            Click to upload image or drag & drop
            <input type="file" id="imageInput" accept="image/*" style="display:none">
          </div>
          <img class="image-preview" id="imagePreview" style="display:none">
        </div>

        <!-- Comments (only shown when editing) -->
        <div class="comments-section" id="commentsSection" style="display:none">
          <h3>Comments</h3>
          <div id="commentsList"></div>
          <div class="comment-input-row" style="position:relative">
            <input type="text" id="commentInput" placeholder="Add a comment... (use @ to mention)">
            <button type="button" class="btn btn-sm btn-primary" id="addCommentBtn">Post</button>
            <div class="mention-dropdown" id="mentionDropdown"></div>
          </div>
        </div>

        <div class="form-actions">
          <button type="button" class="btn btn-danger" id="deleteTaskBtn" style="display:none;margin-right:auto">Delete</button>
          <button type="button" class="btn btn-secondary" id="cancelTaskBtn">Cancel</button>
          <button type="submit" class="btn btn-primary">Save</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Nickname Modal -->
  <div class="modal-overlay" id="nicknameModal">
    <div class="modal nickname-modal">
      <h2>Welcome!</h2>
      <p>Enter your nickname to get started</p>
      <div class="form-group">
        <input type="text" id="nicknameInput" placeholder="Your nickname" maxlength="50">
      </div>
      <div class="form-group">
        <input type="email" id="emailInput" placeholder="Email (optional, for notifications)">
      </div>
      <button class="btn btn-primary" id="nicknameSubmit" style="width:100%">Start</button>
    </div>
  </div>

  <!-- Weekly Report Sidebar -->
  <div class="report-sidebar" id="reportSidebar">
    <div class="report-sidebar-header">
      <span>주간보고 생성</span>
      <button class="report-close-btn" id="reportCloseBtn">✕</button>
    </div>

    <div class="report-section">
      <div class="report-week-row">
        <label>기간</label>
        <select id="reportWeekSelect"></select>
      </div>
    </div>

    <div class="report-section">
      <div class="report-section-label">
        이번주 변경된 태스크
        <span class="report-task-count" id="reportTaskCount"></span>
      </div>
      <div id="reportTaskList" class="report-task-list">
        <div class="report-loading">불러오는 중...</div>
      </div>
    </div>

    <div class="report-section">
      <div class="report-section-label">과거 보고서 예시 붙여넣기</div>
      <textarea id="reportExample" class="report-textarea" placeholder="지난주 보고서 내용을 붙여넣으세요. LLM이 같은 형식으로 작성합니다."></textarea>
    </div>

    <div class="report-actions">
      <button class="btn btn-primary" id="reportGenerateBtn" style="flex:1">보고서 생성</button>
      <button class="btn btn-secondary" id="reportRerunBtn" title="다시 생성" style="display:none">↺</button>
    </div>

    <div class="report-result-wrap" id="reportResultWrap" style="display:none">
      <div class="report-section-label">
        생성된 보고서
        <button class="btn btn-sm btn-secondary" id="reportCopyBtn">복사</button>
      </div>
      <textarea id="reportResult" class="report-textarea report-result" readonly></textarea>
    </div>
  </div>
  <div class="report-overlay" id="reportOverlay"></div>

  <script src="/app.js"></script>
</body>
</html>
