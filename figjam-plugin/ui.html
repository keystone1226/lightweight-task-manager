<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f7f7f8;
      padding: 20px;
      font-size: 13px;
      color: #1a1a2e;
    }

    .logo { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
    .logo-icon {
      width: 32px; height: 32px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      border-radius: 8px; display: flex; align-items: center;
      justify-content: center; color: #fff; font-size: 16px;
    }
    h1 { font-size: 16px; font-weight: 700; }
    .subtitle { color: #6b7280; font-size: 12px; margin-bottom: 16px; }

    /* ── Tabs ─────────────────────────────────── */
    .tabs {
      display: flex; border: 1px solid #e5e7eb;
      border-radius: 8px; overflow: hidden; margin-bottom: 12px;
    }
    .tab-btn {
      flex: 1; padding: 9px 4px; border: none; background: #f9fafb;
      font-size: 12px; font-weight: 600; color: #9ca3af;
      cursor: pointer; border-right: 1px solid #e5e7eb;
    }
    .tab-btn:last-child { border-right: none; }
    .tab-btn.active { background: #eef2ff; color: #4f46e5; }
    .tab-panel { display: none; }
    .tab-panel.active { display: block; }

    /* ── Drop zone ────────────────────────────── */
    .dropzone {
      border: 2px dashed #c7d2fe; border-radius: 10px;
      padding: 20px 12px; text-align: center; cursor: pointer;
      background: #fafafa; transition: border-color .2s, background .2s;
      position: relative;
    }
    .dropzone.hover  { border-color: #6366f1; background: #eef2ff; }
    .dropzone.loaded { border-color: #10b981; background: #f0fdf4; }
    .dropzone input[type="file"] {
      position: absolute; inset: 0; opacity: 0; cursor: pointer;
      width: 100%; height: 100%;
    }
    .drop-icon  { font-size: 22px; margin-bottom: 4px; }
    .drop-title { font-size: 12px; font-weight: 600; color: #374151; }
    .drop-hint  { font-size: 11px; color: #9ca3af; margin-top: 2px; }

    .file-badge {
      display: none; align-items: center; gap: 8px; margin-top: 8px;
      padding: 7px 10px; background: #f3f4f6; border-radius: 6px;
    }
    .file-badge.visible { display: flex; }
    .file-badge-name { font-size: 12px; font-weight: 600; flex: 1;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .remove-btn {
      background: none; border: none; cursor: pointer;
      color: #9ca3af; font-size: 14px; padding: 2px 4px;
    }
    .remove-btn:hover { color: #ef4444; }

    /* ── Options section ──────────────────────── */
    .options-section {
      border: 1px solid #e5e7eb; border-radius: 8px;
      margin-bottom: 10px; overflow: hidden;
    }
    .options-header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 8px 12px; background: #f9fafb; cursor: pointer;
      font-size: 12px; font-weight: 600; color: #374151;
    }
    .options-header:hover { background: #f3f4f6; }
    .options-body { padding: 10px 12px; background: #fff; }
    .option-row {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 8px;
    }
    .option-row:last-child { margin-bottom: 0; }
    .option-label { font-size: 11px; font-weight: 600; color: #6b7280; }

    /* Segmented control */
    .seg-group {
      display: flex; border: 1px solid #e5e7eb; border-radius: 6px; overflow: hidden;
    }
    .seg-btn {
      padding: 4px 9px; border: none; background: #f9fafb;
      font-size: 11px; font-weight: 600; color: #9ca3af;
      cursor: pointer; border-right: 1px solid #e5e7eb;
    }
    .seg-btn:last-child { border-right: none; }
    .seg-btn.active { background: #eef2ff; color: #4f46e5; }

    /* Toggle */
    .toggle-wrap {
      position: relative; display: inline-block; width: 36px; height: 20px;
    }
    .toggle-wrap input { opacity: 0; width: 0; height: 0; position: absolute; }
    .toggle-slider {
      position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
      background-color: #d1d5db; transition: .2s; border-radius: 20px;
    }
    .toggle-slider:before {
      position: absolute; content: ""; height: 14px; width: 14px;
      left: 3px; bottom: 3px; background-color: white;
      transition: .2s; border-radius: 50%;
    }
    .toggle-wrap input:checked + .toggle-slider { background-color: #6366f1; }
    .toggle-wrap input:checked + .toggle-slider:before { transform: translateX(16px); }

    /* ── Preview ──────────────────────────────── */
    .preview {
      display: none; margin-top: 10px;
      background: #fff; border: 1px solid #e5e7eb;
      border-radius: 8px; padding: 10px 12px;
    }
    .preview.visible { display: block; }
    .preview-title { font-weight: 700; font-size: 13px; margin-bottom: 8px; }
    .badges { display: flex; gap: 6px; flex-wrap: wrap; }
    .badge { padding: 3px 9px; border-radius: 20px; font-size: 11px; font-weight: 600; }
    .badge-q  { background: #fef9c3; color: #854d0e; }
    .badge-pp { background: #fee2e2; color: #991b1b; }
    .badge-fl { background: #ede9fe; color: #5b21b6; }

    /* ── Status ───────────────────────────────── */
    .status {
      display: none; margin-top: 10px;
      padding: 9px 11px; border-radius: 7px;
      font-size: 12px; align-items: center; gap: 8px;
    }
    .status.info    { display: flex; background: #eff6ff; color: #1d4ed8; border: 1px solid #bfdbfe; }
    .status.success { display: flex; background: #f0fdf4; color: #15803d; border: 1px solid #bbf7d0; }
    .status.error   { display: flex; background: #fef2f2; color: #b91c1c; border: 1px solid #fecaca; }

    /* ── Buttons ──────────────────────────────── */
    .btn-primary {
      width: 100%; margin-top: 12px; padding: 11px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      color: #fff; border: none; border-radius: 8px;
      font-size: 13px; font-weight: 600; cursor: pointer;
      transition: opacity .2s;
    }
    .btn-primary:disabled { opacity: 0.38; cursor: not-allowed; }
    .btn-primary:not(:disabled):hover { opacity: 0.88; }

    .btn-secondary {
      width: 100%; margin-top: 8px; padding: 10px;
      background: #fff; border: 1px solid #6366f1;
      border-radius: 8px; font-size: 13px; font-weight: 600;
      color: #6366f1; cursor: pointer; transition: background .2s;
    }
    .btn-secondary:disabled { opacity: 0.38; cursor: not-allowed; }
    .btn-secondary:not(:disabled):hover { background: #eef2ff; }

    .btn-cancel {
      width: 100%; margin-top: 8px; padding: 9px;
      background: none; border: 1px solid #d1d5db;
      border-radius: 8px; font-size: 12px; color: #6b7280; cursor: pointer;
    }
    .btn-cancel:hover { background: #f3f4f6; }

    .spinner {
      display: inline-block; width: 12px; height: 12px;
      border: 2px solid #bfdbfe; border-top-color: #1d4ed8;
      border-radius: 50%; animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="logo">
    <div class="logo-icon">🎤</div>
    <h1>Interview Insights</h1>
  </div>
  <p class="subtitle">녹취록을 분석해 FigJam에 한 판으로 정리합니다.</p>

  <!-- 입력 탭 -->
  <div class="tabs">
    <button class="tab-btn active" data-tab="txt">📄 녹취록 (.txt)</button>
    <button class="tab-btn"        data-tab="json">📊 결과 불러오기 (.json)</button>
  </div>

  <!-- TXT 탭 -->
  <div class="tab-panel active" id="panel-txt">
    <div class="dropzone" id="dropzoneTxt">
      <input type="file" id="fileInputTxt" accept=".txt,text/plain" />
      <div class="drop-icon">📄</div>
      <div class="drop-title">클릭하거나 드래그해서 파일 선택</div>
      <div class="drop-hint">.txt 녹취록 파일</div>
    </div>
    <div class="file-badge" id="fileBadgeTxt">
      <span>📄</span>
      <span class="file-badge-name" id="fbNameTxt"></span>
      <button class="remove-btn" id="removeBtnTxt">✕</button>
    </div>
  </div>

  <!-- JSON 탭 -->
  <div class="tab-panel" id="panel-json">
    <div class="dropzone" id="dropzoneJson">
      <input type="file" id="fileInputJson" accept=".json,application/json" />
      <div class="drop-icon">📊</div>
      <div class="drop-title">클릭하거나 드래그해서 파일 선택</div>
      <div class="drop-hint">이전에 다운로드한 분석 결과 .json 파일</div>
    </div>
    <div class="file-badge" id="fileBadgeJson">
      <span>📊</span>
      <span class="file-badge-name" id="fbNameJson"></span>
      <button class="remove-btn" id="removeBtnJson">✕</button>
    </div>
  </div>

  <!-- 분석 옵션 (txt 탭에서만 표시) -->
  <div class="options-section" id="optionsSection">
    <div class="options-header" id="optionsHeader">
      <span>⚙ 분석 옵션</span>
      <span id="optionsArrow">▾</span>
    </div>
    <div class="options-body" id="optionsBody" style="display:none">
      <div class="option-row">
        <span class="option-label">클러스터링</span>
        <div class="seg-group" id="clusteringGroup">
          <button class="seg-btn" data-value="fine"   title="더 많은 항목, 세밀하게 분류">세밀</button>
          <button class="seg-btn active" data-value="normal" title="기본 설정">보통</button>
          <button class="seg-btn" data-value="coarse" title="핵심 항목만, 큰 단위로 묶기">광범위</button>
        </div>
      </div>
      <div class="option-row">
        <span class="option-label">플로우 분석</span>
        <label class="toggle-wrap">
          <input type="checkbox" id="flowToggle" checked>
          <span class="toggle-slider"></span>
        </label>
      </div>
      <div class="option-row">
        <span class="option-label">집중 영역</span>
        <div class="seg-group" id="focusGroup">
          <button class="seg-btn active" data-value="balanced" title="질문·페인포인트·플로우 균형">균형</button>
          <button class="seg-btn" data-value="pain"     title="페인포인트 위주로 상세 분석">페인포인트</button>
          <button class="seg-btn" data-value="flow"     title="프로세스 흐름 위주로 분석">플로우</button>
        </div>
      </div>
    </div>
  </div>

  <div class="preview" id="preview">
    <div class="preview-title" id="previewTitle"></div>
    <div class="badges">
      <span class="badge badge-q"  id="badgeQ"></span>
      <span class="badge badge-pp" id="badgePP"></span>
      <span class="badge badge-fl" id="badgeFL"></span>
    </div>
  </div>

  <div class="status" id="status"></div>

  <button class="btn-primary"   id="analyzeBtn">분석 시작</button>
  <button class="btn-primary"   id="createBtn"  style="display:none">FigJam 보드 생성</button>
  <button class="btn-secondary" id="downloadBtn" style="display:none">JSON 다운로드</button>
  <button class="btn-cancel"    id="cancelBtn">닫기</button>

<script>
var transcriptText = "";
var transcriptName = "";
var resultData     = null;
var activeTab      = "txt";

var dropzoneTxt   = document.getElementById("dropzoneTxt");
var fileInputTxt  = document.getElementById("fileInputTxt");
var fileBadgeTxt  = document.getElementById("fileBadgeTxt");
var fbNameTxt     = document.getElementById("fbNameTxt");
var removeBtnTxt  = document.getElementById("removeBtnTxt");

var dropzoneJson  = document.getElementById("dropzoneJson");
var fileInputJson = document.getElementById("fileInputJson");
var fileBadgeJson = document.getElementById("fileBadgeJson");
var fbNameJson    = document.getElementById("fbNameJson");
var removeBtnJson = document.getElementById("removeBtnJson");

var optionsSection = document.getElementById("optionsSection");
var optionsHeader  = document.getElementById("optionsHeader");
var optionsBody    = document.getElementById("optionsBody");
var optionsArrow   = document.getElementById("optionsArrow");
var flowToggle     = document.getElementById("flowToggle");

var preview    = document.getElementById("preview");
var prevTitle  = document.getElementById("previewTitle");
var badgeQ     = document.getElementById("badgeQ");
var badgePP    = document.getElementById("badgePP");
var badgeFL    = document.getElementById("badgeFL");
var statusEl   = document.getElementById("status");
var analyzeBtn = document.getElementById("analyzeBtn");
var createBtn  = document.getElementById("createBtn");
var downloadBtn= document.getElementById("downloadBtn");
var cancelBtn  = document.getElementById("cancelBtn");

// ── 탭 전환 ──────────────────────────────────
document.querySelectorAll(".tab-btn").forEach(function(btn) {
  btn.addEventListener("click", function() {
    var tab = btn.dataset.tab;
    if (tab === activeTab) return;
    activeTab = tab;

    document.querySelectorAll(".tab-btn").forEach(function(b) { b.classList.remove("active"); });
    document.querySelectorAll(".tab-panel").forEach(function(p) { p.classList.remove("active"); });
    btn.classList.add("active");
    document.getElementById("panel-" + tab).classList.add("active");

    // 상태 초기화
    transcriptText = "";
    transcriptName = "";
    resultData     = null;
    fileBadgeTxt.classList.remove("visible");
    dropzoneTxt.classList.remove("loaded");
    fileInputTxt.value = "";
    fileBadgeJson.classList.remove("visible");
    dropzoneJson.classList.remove("loaded");
    fileInputJson.value = "";
    preview.classList.remove("visible");
    clearStatus();
    createBtn.style.display  = "none";
    downloadBtn.style.display = "none";

    if (tab === "txt") {
      analyzeBtn.style.display   = "";
      optionsSection.style.display = "";
      updateAnalyzeBtn();
    } else {
      analyzeBtn.style.display   = "none";
      optionsSection.style.display = "none";
    }
  });
});

// ── TXT 파일 업로드 ───────────────────────────
dropzoneTxt.addEventListener("dragover",  function(e) { e.preventDefault(); dropzoneTxt.classList.add("hover"); });
dropzoneTxt.addEventListener("dragleave", function()  { dropzoneTxt.classList.remove("hover"); });
dropzoneTxt.addEventListener("drop", function(e) {
  e.preventDefault();
  dropzoneTxt.classList.remove("hover");
  loadTxtFile(e.dataTransfer.files[0]);
});
fileInputTxt.addEventListener("change", function() { loadTxtFile(fileInputTxt.files[0]); });

function loadTxtFile(file) {
  if (!file) return;
  var ext = file.name.split(".").pop().toLowerCase();
  if (ext !== "txt") { showStatus("error", "텍스트 파일(.txt)만 지원됩니다."); return; }
  var reader = new FileReader();
  reader.onload = function(e) {
    transcriptText = e.target.result;
    transcriptName = file.name;
    fbNameTxt.textContent = file.name;
    fileBadgeTxt.classList.add("visible");
    dropzoneTxt.classList.add("loaded");
    clearStatus();
    updateAnalyzeBtn();
  };
  reader.readAsText(file, "utf-8");
}

removeBtnTxt.addEventListener("click", function(e) {
  e.stopPropagation();
  transcriptText = ""; transcriptName = "";
  fileBadgeTxt.classList.remove("visible");
  dropzoneTxt.classList.remove("loaded");
  fileInputTxt.value = "";
  updateAnalyzeBtn();
});

// ── JSON 파일 업로드 ──────────────────────────
dropzoneJson.addEventListener("dragover",  function(e) { e.preventDefault(); dropzoneJson.classList.add("hover"); });
dropzoneJson.addEventListener("dragleave", function()  { dropzoneJson.classList.remove("hover"); });
dropzoneJson.addEventListener("drop", function(e) {
  e.preventDefault();
  dropzoneJson.classList.remove("hover");
  loadJsonFile(e.dataTransfer.files[0]);
});
fileInputJson.addEventListener("change", function() { loadJsonFile(fileInputJson.files[0]); });

function loadJsonFile(file) {
  if (!file) return;
  var ext = file.name.split(".").pop().toLowerCase();
  if (ext !== "json") { showStatus("error", "JSON 파일(.json)만 지원됩니다."); return; }
  var reader = new FileReader();
  reader.onload = function(e) {
    try {
      var data = JSON.parse(e.target.result);
      resultData = data;
      fbNameJson.textContent = file.name;
      fileBadgeJson.classList.add("visible");
      dropzoneJson.classList.add("loaded");
      showPreview(data);
      showStatus("success", "✅ 분석 결과 로드 완료 — 바로 보드를 생성할 수 있습니다.");
      createBtn.style.display   = "";
      downloadBtn.style.display = "";
      createBtn.disabled = false;
    } catch(err) {
      showStatus("error", "❌ JSON 파싱 오류: " + err.message);
    }
  };
  reader.readAsText(file, "utf-8");
}

removeBtnJson.addEventListener("click", function(e) {
  e.stopPropagation();
  resultData = null;
  fileBadgeJson.classList.remove("visible");
  dropzoneJson.classList.remove("loaded");
  fileInputJson.value = "";
  preview.classList.remove("visible");
  clearStatus();
  createBtn.style.display   = "none";
  downloadBtn.style.display = "none";
});

// ── 분석 옵션 (접기/펼치기) ───────────────────
optionsHeader.addEventListener("click", function() {
  var isOpen = optionsBody.style.display !== "none";
  optionsBody.style.display = isOpen ? "none" : "";
  optionsArrow.textContent  = isOpen ? "▾" : "▴";
});

// 세그먼트 버튼 토글
document.querySelectorAll("#clusteringGroup .seg-btn").forEach(function(btn) {
  btn.addEventListener("click", function() {
    document.querySelectorAll("#clusteringGroup .seg-btn").forEach(function(b) { b.classList.remove("active"); });
    btn.classList.add("active");
  });
});

document.querySelectorAll("#focusGroup .seg-btn").forEach(function(btn) {
  btn.addEventListener("click", function() {
    document.querySelectorAll("#focusGroup .seg-btn").forEach(function(b) { b.classList.remove("active"); });
    btn.classList.add("active");
  });
});

function getOptions() {
  var clusterBtn = document.querySelector("#clusteringGroup .seg-btn.active");
  var focusBtn   = document.querySelector("#focusGroup .seg-btn.active");
  return {
    clustering:    clusterBtn ? clusterBtn.dataset.value : "normal",
    include_flows: flowToggle.checked,
    focus:         focusBtn ? focusBtn.dataset.value : "balanced"
  };
}

function updateAnalyzeBtn() {
  analyzeBtn.disabled = !transcriptText;
}
analyzeBtn.disabled = true;

// ── 분석 요청 ─────────────────────────────────
analyzeBtn.addEventListener("click", function() {
  if (!transcriptText) return;
  analyzeBtn.disabled = true;

  var wordCount  = transcriptText.split(/\s+/).filter(Boolean).length;
  var chunkCount = Math.ceil(wordCount / 4000);
  showStatus("info", '<span class="spinner"></span>&nbsp; 분석 중… (' + wordCount.toLocaleString() + '단어' + (chunkCount > 1 ? ', ' + chunkCount + '개 청크' : '') + ')');

  fetch("http://localhost:5500/analyze", {
    method: "POST",
    headers: { "content-type": "application/json" },
    body: JSON.stringify({ transcript: transcriptText, source_name: transcriptName, options: getOptions() })
  })
  .then(function(resp) {
    if (!resp.ok) {
      return resp.json().then(function(e) { throw new Error(e.error || ("HTTP " + resp.status)); });
    }
    return resp.json();
  })
  .then(function(data) {
    resultData = data;
    showPreview(data);
    showStatus("success", "✅ 분석 완료!");
    analyzeBtn.style.display  = "none";
    createBtn.style.display   = "";
    downloadBtn.style.display = "";
    createBtn.disabled = false;
  })
  .catch(function(err) {
    showStatus("error", "❌ " + err.message);
    analyzeBtn.disabled = false;
  });
});

function showPreview(data) {
  prevTitle.textContent = data.interview_title || "(제목 없음)";
  badgeQ.textContent  = "💬 질문 "       + (data.questions   || []).length + "개";
  badgePP.textContent = "⚠️ 페인포인트 " + (data.pain_points || []).length + "개";
  badgeFL.textContent = "🔀 플로우 "      + (data.flows       || []).length + "개";
  preview.classList.add("visible");
}

// ── FigJam 보드 생성 ──────────────────────────
createBtn.addEventListener("click", function() {
  if (!resultData) return;
  createBtn.disabled = true;
  showStatus("info", '<span class="spinner"></span>&nbsp; 보드 생성 중…');
  parent.postMessage({ pluginMessage: { type: "CREATE_BOARD", data: resultData } }, "*");
});

// ── JSON 다운로드 ─────────────────────────────
downloadBtn.addEventListener("click", function() {
  if (!resultData) return;
  var filename = (resultData.interview_title || "interview").replace(/\s+/g, "_") + "_analysis.json";
  var blob = new Blob([JSON.stringify(resultData, null, 2)], { type: "application/json" });
  var url  = URL.createObjectURL(blob);
  var a    = document.createElement("a");
  a.href     = url;
  a.download = filename;
  a.click();
  URL.revokeObjectURL(url);
});

cancelBtn.addEventListener("click", function() {
  parent.postMessage({ pluginMessage: { type: "CLOSE" } }, "*");
});

// ── code.js 메시지 수신 ───────────────────────
window.onmessage = function(e) {
  var msg = e.data.pluginMessage;
  if (!msg) return;
  if (msg.type === "STATUS") showStatus("info", '<span class="spinner"></span>&nbsp; ' + msg.message);
  if (msg.type === "DONE")   { showStatus("success", "✅ FigJam 보드 생성 완료!"); createBtn.disabled = false; }
  if (msg.type === "ERROR")  { showStatus("error", "❌ 오류: " + msg.message); createBtn.disabled = false; }
};

function showStatus(type, html) {
  statusEl.className = "status " + type;
  statusEl.innerHTML = html;
}
function clearStatus() {
  statusEl.className = "status";
  statusEl.innerHTML = "";
}
</script>
</body>
</html>
