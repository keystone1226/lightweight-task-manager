<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Langflow → draw.io 변환기</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f0f2f5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.10);
      padding: 40px 48px;
      max-width: 560px;
      width: 100%;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 8px;
    }

    .logo-icon {
      width: 40px;
      height: 40px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 20px;
    }

    h1 {
      font-size: 22px;
      font-weight: 700;
      color: #1a1a2e;
    }

    .subtitle {
      color: #6b7280;
      font-size: 14px;
      margin-bottom: 32px;
      margin-top: 4px;
    }

    /* Drop zone */
    .dropzone {
      border: 2px dashed #c7d2fe;
      border-radius: 12px;
      padding: 40px 24px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
      background: #fafafa;
      position: relative;
    }

    .dropzone.hover {
      border-color: #6366f1;
      background: #eef2ff;
    }

    .dropzone.has-file {
      border-color: #10b981;
      background: #f0fdf4;
    }

    .dropzone input[type="file"] {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
      width: 100%;
      height: 100%;
    }

    .drop-icon {
      font-size: 36px;
      margin-bottom: 12px;
    }

    .drop-title {
      font-size: 15px;
      font-weight: 600;
      color: #374151;
      margin-bottom: 4px;
    }

    .drop-hint {
      font-size: 13px;
      color: #9ca3af;
    }

    /* File info */
    .file-info {
      display: none;
      align-items: center;
      gap: 12px;
      margin-top: 16px;
      padding: 12px 16px;
      background: #f3f4f6;
      border-radius: 8px;
    }

    .file-info.visible { display: flex; }

    .file-icon { font-size: 22px; }

    .file-details { flex: 1; min-width: 0; }

    .file-name {
      font-size: 14px;
      font-weight: 600;
      color: #111827;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .file-meta { font-size: 12px; color: #6b7280; margin-top: 2px; }

    .remove-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: #9ca3af;
      font-size: 18px;
      padding: 4px;
      border-radius: 4px;
      line-height: 1;
    }

    .remove-btn:hover { color: #ef4444; background: #fee2e2; }

    /* Stats */
    .stats {
      display: none;
      gap: 12px;
      margin-top: 16px;
    }

    .stats.visible { display: flex; }

    .stat {
      flex: 1;
      background: #f9fafb;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      padding: 10px 14px;
      text-align: center;
    }

    .stat-value {
      font-size: 22px;
      font-weight: 700;
      color: #6366f1;
    }

    .stat-label { font-size: 11px; color: #9ca3af; margin-top: 2px; }

    /* Convert button */
    .convert-btn {
      width: 100%;
      margin-top: 24px;
      padding: 14px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
    }

    .convert-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      transform: none;
    }

    .convert-btn:not(:disabled):hover { opacity: 0.92; }
    .convert-btn:not(:disabled):active { transform: scale(0.99); }

    /* Toast */
    .toast {
      display: none;
      align-items: center;
      gap: 10px;
      margin-top: 16px;
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 14px;
    }

    .toast.success {
      display: flex;
      background: #f0fdf4;
      border: 1px solid #bbf7d0;
      color: #15803d;
    }

    .toast.error {
      display: flex;
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: #b91c1c;
    }

    .footer {
      margin-top: 28px;
      padding-top: 20px;
      border-top: 1px solid #f3f4f6;
      font-size: 12px;
      color: #9ca3af;
      text-align: center;
      line-height: 1.6;
    }
  </style>
</head>
<body>
<div class="card">
  <div class="logo">
    <div class="logo-icon">⟳</div>
    <h1>Langflow → draw.io</h1>
  </div>
  <p class="subtitle">flow_structure.json 파일을 가져오면 .drawio 파일로 변환해 드립니다.</p>

  <!-- Drop zone -->
  <div class="dropzone" id="dropzone">
    <input type="file" id="fileInput" accept=".json,application/json" />
    <div class="drop-icon">📂</div>
    <div class="drop-title">JSON 파일을 드래그하거나 클릭해서 선택</div>
    <div class="drop-hint">.json 파일만 지원됩니다</div>
  </div>

  <!-- Selected file info -->
  <div class="file-info" id="fileInfo">
    <span class="file-icon">📄</span>
    <div class="file-details">
      <div class="file-name" id="fileName"></div>
      <div class="file-meta" id="fileMeta"></div>
    </div>
    <button class="remove-btn" id="removeBtn" title="파일 제거">✕</button>
  </div>

  <!-- Stats -->
  <div class="stats" id="stats">
    <div class="stat">
      <div class="stat-value" id="statNodes">—</div>
      <div class="stat-label">노드</div>
    </div>
    <div class="stat">
      <div class="stat-value" id="statEdges">—</div>
      <div class="stat-label">엣지</div>
    </div>
    <div class="stat">
      <div class="stat-value" id="statName">—</div>
      <div class="stat-label">플로우 이름</div>
    </div>
  </div>

  <!-- Convert button -->
  <button class="convert-btn" id="convertBtn" disabled>
    .drawio 파일로 변환 및 다운로드
  </button>

  <!-- Result toast -->
  <div class="toast" id="toast"></div>

  <div class="footer">
    설치 불필요 · 파일이 서버로 전송되지 않습니다 · 브라우저 내에서만 처리됩니다
  </div>
</div>

<script>
// ─────────────────────────────────────────────
// draw.io 스타일 상수 (Python 스크립트와 동일)
// ─────────────────────────────────────────────
const COMPONENT_STYLES = {
  ChatInput:   "rounded=1;whiteSpace=wrap;html=1;fillColor=#dae8fc;strokeColor=#6c8ebf;fontStyle=1;fontSize=12;",
  ChatOutput:  "rounded=1;whiteSpace=wrap;html=1;fillColor=#d5e8d4;strokeColor=#82b366;fontStyle=1;fontSize=12;",
  TextInput:   "rounded=1;whiteSpace=wrap;html=1;fillColor=#fff2cc;strokeColor=#d6b656;fontSize=11;",
  OpenAIModel: "rounded=1;whiteSpace=wrap;html=1;fillColor=#f8cecc;strokeColor=#b85450;fontStyle=1;fontSize=12;",
  Prompt:      "rounded=1;whiteSpace=wrap;html=1;fillColor=#e1d5e7;strokeColor=#9673a6;fontSize=12;",
};

const DEFAULT_NODE_STYLE =
  "rounded=1;whiteSpace=wrap;html=1;fillColor=#f5f5f5;strokeColor=#666666;fontColor=#333333;fontSize=11;";

const EDGE_STYLE =
  "edgeStyle=orthogonalEdgeStyle;rounded=0;orthogonalLoop=1;jettySize=auto;" +
  "exitX=1;exitY=0.5;exitDx=0;exitDy=0;entryX=0;entryY=0.5;entryDx=0;entryDy=0;";

const NODE_WIDTH  = 180;
const NODE_HEIGHT = 60;

// ─────────────────────────────────────────────
// 변환 함수
// ─────────────────────────────────────────────
function escape(str) {
  return String(str)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

function nodeLabel(nodeData) {
  const info = nodeData.node || {};
  const displayName = info.display_name || nodeData.type || "Unknown";
  const type = nodeData.type || "";
  if (type && type !== displayName) {
    return `&lt;b&gt;${escape(displayName)}&lt;/b&gt;&lt;br/&gt;&lt;i style='font-size:10px'&gt;${escape(type)}&lt;/i&gt;`;
  }
  return `&lt;b&gt;${escape(displayName)}&lt;/b&gt;`;
}

function nodeStyle(type) {
  return COMPONENT_STYLES[type] || DEFAULT_NODE_STYLE;
}

function convertToDrawio(flow) {
  const data  = flow.data || {};
  const nodes = data.nodes || [];
  const edges = data.edges || [];

  const lines = [];

  lines.push('<?xml version="1.0" encoding="UTF-8"?>');
  lines.push('<mxGraphModel dx="1422" dy="762" grid="1" gridSize="10" guides="1" tooltips="1"' +
    ' connect="1" arrows="1" fold="1" page="1" pageScale="1"' +
    ' pageWidth="1169" pageHeight="827" math="0" shadow="0">');
  lines.push('  <root>');
  lines.push('    <mxCell id="0"/>');
  lines.push('    <mxCell id="1" parent="0"/>');

  // Nodes
  for (const node of nodes) {
    const id  = escape(node.id || "");
    const pos = node.position || {};
    const x   = Math.round(pos.x || 0);
    const y   = Math.round(pos.y || 0);
    const nd  = node.data || {};
    const style = nodeStyle(nd.type || "");
    const label = nodeLabel(nd);

    lines.push(
      `    <mxCell id="${id}" value="${label}" style="${escape(style)}" vertex="1" parent="1">`
    );
    lines.push(
      `      <mxGeometry x="${x}" y="${y}" width="${NODE_WIDTH}" height="${NODE_HEIGHT}" as="geometry"/>`
    );
    lines.push("    </mxCell>");
  }

  // Edges
  for (const edge of edges) {
    const id     = escape(edge.id || "");
    const src    = escape(edge.source || "");
    const tgt    = escape(edge.target || "");
    const sh     = edge.sourceHandle || "";
    const th     = edge.targetHandle || "";
    const tooltip = sh && th ? escape(`${sh} → ${th}`) : "";

    lines.push(
      `    <mxCell id="${id}" value="${tooltip}" style="${escape(EDGE_STYLE)}"` +
      ` edge="1" source="${src}" target="${tgt}" parent="1">`
    );
    lines.push('      <mxGeometry relative="1" as="geometry"/>');
    lines.push("    </mxCell>");
  }

  lines.push("  </root>");
  lines.push("</mxGraphModel>");

  return lines.join("\n");
}

// ─────────────────────────────────────────────
// UI 로직
// ─────────────────────────────────────────────
let currentFlow    = null;
let currentFileName = "";

const dropzone   = document.getElementById("dropzone");
const fileInput  = document.getElementById("fileInput");
const fileInfo   = document.getElementById("fileInfo");
const fileName   = document.getElementById("fileName");
const fileMeta   = document.getElementById("fileMeta");
const removeBtn  = document.getElementById("removeBtn");
const statsEl    = document.getElementById("stats");
const statNodes  = document.getElementById("statNodes");
const statEdges  = document.getElementById("statEdges");
const statName   = document.getElementById("statName");
const convertBtn = document.getElementById("convertBtn");
const toast      = document.getElementById("toast");

function showToast(type, msg) {
  toast.className = `toast ${type}`;
  toast.innerHTML = (type === "success" ? "✅ " : "❌ ") + msg;
}

function clearToast() {
  toast.className = "toast";
  toast.textContent = "";
}

function resetUI() {
  currentFlow = null;
  currentFileName = "";
  fileInfo.classList.remove("visible");
  statsEl.classList.remove("visible");
  dropzone.classList.remove("has-file");
  convertBtn.disabled = true;
  clearToast();
  fileInput.value = "";
}

function loadFile(file) {
  if (!file) return;
  if (!file.name.endsWith(".json")) {
    showToast("error", ".json 파일만 지원됩니다.");
    return;
  }

  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const flow = JSON.parse(e.target.result);
      const nodes = (flow.data?.nodes || []).length;
      const edges = (flow.data?.edges || []).length;

      currentFlow     = flow;
      currentFileName = file.name;

      // Update file info
      fileName.textContent = file.name;
      fileMeta.textContent = `${(file.size / 1024).toFixed(1)} KB`;
      fileInfo.classList.add("visible");

      // Update stats
      statNodes.textContent = nodes;
      statEdges.textContent = edges;
      statName.textContent  = flow.name || "—";
      statsEl.classList.add("visible");

      dropzone.classList.add("has-file");
      convertBtn.disabled = false;
      clearToast();
    } catch {
      showToast("error", "JSON 파싱 실패: 올바른 Langflow flow 파일인지 확인하세요.");
    }
  };
  reader.readAsText(file);
}

// Drag & drop
dropzone.addEventListener("dragover", (e) => {
  e.preventDefault();
  dropzone.classList.add("hover");
});
dropzone.addEventListener("dragleave", () => dropzone.classList.remove("hover"));
dropzone.addEventListener("drop", (e) => {
  e.preventDefault();
  dropzone.classList.remove("hover");
  const file = e.dataTransfer.files[0];
  if (file) loadFile(file);
});

// File picker
fileInput.addEventListener("change", () => {
  if (fileInput.files[0]) loadFile(fileInput.files[0]);
});

// Remove file
removeBtn.addEventListener("click", (e) => {
  e.stopPropagation();
  resetUI();
});

// Convert & download
convertBtn.addEventListener("click", () => {
  if (!currentFlow) return;

  try {
    const xml       = convertToDrawio(currentFlow);
    const blob      = new Blob([xml], { type: "application/xml" });
    const url       = URL.createObjectURL(blob);
    const a         = document.createElement("a");
    const outName   = currentFileName.replace(/\.json$/i, ".drawio");

    a.href     = url;
    a.download = outName;
    a.click();
    URL.revokeObjectURL(url);

    const nodes = (currentFlow.data?.nodes || []).length;
    const edges = (currentFlow.data?.edges || []).length;
    showToast("success", `${outName} 다운로드 완료 (노드 ${nodes}개, 엣지 ${edges}개)`);
  } catch (err) {
    showToast("error", `변환 실패: ${err.message}`);
  }
});
</script>
</body>
</html>
